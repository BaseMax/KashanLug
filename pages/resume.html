<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پروفایل شبکه‌سازی | کاشان‌لاگ</title>
    <meta name="description" content="پروفایل شبکه‌سازی و رزومهٔ متصل به کارت NFC کاشان‌لاگ." />
    <link rel="icon" type="image/png" href="/assets/images/KL1-02.png" />
    <style>
      @media print {
        .no-print { display: none !important; }
        body { background: #fff !important; }
        .resume-paper { box-shadow: none !important; border: none !important; }
      }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </head>

  <body data-page="resume" class="bg-ink-950 text-gray-200 antialiased" x-data="resumeApp">
    <div id="header" class="no-print"></div>

    <main class="pt-28 pb-20 px-4 relative overflow-hidden">
      <div class="glow w-96 h-96 bg-brand-600/10 -top-10 left-1/2 -translate-x-1/2 no-print"></div>

      <!-- NFC hint -->
      <div class="relative max-w-3xl mx-auto mb-6 no-print">
        <div class="flex flex-col sm:flex-row items-center justify-between gap-4 p-4 rounded-2xl bg-ink-900 border border-white/10">
          <div class="flex items-center gap-3 text-sm text-gray-400">
            <span class="w-9 h-9 rounded-xl bg-term-500/15 text-term-400 flex items-center justify-center shrink-0">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.111 16.404a5.5 5.5 0 017.778 0M12 20h.01m-7.08-7.071c3.904-3.905 10.236-3.905 14.141 0M1.394 9.393c5.857-5.857 15.355-5.857 21.213 0"/></svg>
            </span>
            این صفحه نمونه‌ای از پروفایل متصل به کارت NFC کاشان‌لاگ است.
          </div>
          <button @click="print()" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-white/5 border border-white/10 text-gray-200 text-sm font-bold hover:bg-white/10 transition-colors shrink-0">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
            چاپ / دانلود PDF
          </button>
        </div>
      </div>

      <!-- resume paper -->
      <div class="resume-paper relative max-w-3xl mx-auto bg-ink-900 border border-white/10 rounded-3xl overflow-hidden shadow-2xl">
        <div class="h-2 bg-gradient-to-l from-brand-500 to-term-500"></div>
        <div class="p-8 sm:p-12">
          <!-- header -->
          <header class="flex flex-col-reverse sm:flex-row items-center sm:items-start gap-8 pb-8 mb-8 border-b border-white/10">
            <div class="flex-1 text-center sm:text-right w-full">
              <h1 class="text-3xl font-black text-white mb-1" x-text="profile.name"></h1>
              <p class="text-brand-400 font-mono uppercase tracking-widest text-sm mb-5" x-text="profile.title"></p>
              <ul class="flex flex-col gap-2.5 text-sm text-gray-400 font-mono">
                <li class="flex items-center gap-3 justify-center sm:justify-start">
                  <svg class="w-4 h-4 text-gray-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                  <span class="break-all" x-text="profile.email"></span>
                </li>
                <li class="flex items-center gap-3 justify-center sm:justify-start">
                  <svg class="w-4 h-4 text-gray-500 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a2 2 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                  <span x-text="profile.location"></span>
                </li>
                <li class="flex items-center gap-3 justify-center sm:justify-start" x-show="profile.github">
                  <svg class="w-4 h-4 text-gray-500 shrink-0" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.48 2 2 6.48 2 12c0 4.42 2.87 8.17 6.84 9.49.5.09.68-.22.68-.48 0-.24-.01-.87-.01-1.7-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.46-1.11-1.46-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.89 1.53 2.34 1.09 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.56-1.11-4.56-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02A9.56 9.56 0 0 1 12 6.84c.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.69-4.57 4.94.36.31.68.92.68 1.85 0 1.34-.01 2.42-.01 2.74 0 .27.18.58.69.48A10 10 0 0 0 22 12c0-5.52-4.48-10-10-10z"/></svg>
                  <a :href="profile.github" target="_blank" rel="noopener" class="hover:text-brand-400 transition-colors break-all" x-text="profile.github.replace('https://','')"></a>
                </li>
                <li class="flex items-center gap-3 justify-center sm:justify-start" x-show="profile.linkedin">
                  <svg class="w-4 h-4 text-gray-500 shrink-0" fill="currentColor" viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
                  <a :href="profile.linkedin" target="_blank" rel="noopener" class="hover:text-brand-400 transition-colors break-all">LinkedIn</a>
                </li>
              </ul>
            </div>
            <div class="w-32 h-32 shrink-0">
              <img :src="profile.avatar" :alt="profile.name" class="w-full h-full object-cover rounded-2xl ring-2 ring-white/10 bg-ink-800" />
            </div>
          </header>

          <!-- about (terminal) -->
          <section class="mb-8" dir="ltr">
            <div class="bg-ink-950 rounded-2xl border border-white/10 overflow-hidden">
              <div class="flex items-center gap-2 px-4 py-2 bg-ink-850 border-b border-white/5">
                <span class="font-mono text-xs text-gray-500">bash - about_me.txt</span>
              </div>
              <div class="p-5 font-mono text-sm">
                <p class="text-term-400 mb-2">$ cat about_me.txt</p>
                <p dir="rtl" class="text-gray-300 leading-relaxed text-right" x-text="profile.about"></p>
              </div>
            </div>
          </section>

          <!-- skills -->
          <section>
            <h2 class="flex items-center gap-2 text-lg font-bold text-white mb-4">
              <svg class="w-5 h-5 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
              مهارت‌ها
            </h2>
            <div class="flex flex-wrap gap-2">
              <template x-for="s in profile.skills" :key="s">
                <span class="px-3 py-1.5 rounded-lg bg-ink-950 border border-white/10 text-gray-300 text-sm font-mono" x-text="s"></span>
              </template>
            </div>
          </section>
        </div>
      </div>

      <p class="relative max-w-3xl mx-auto mt-6 text-center text-gray-600 text-xs no-print">
        برای ساخت پروفایل اختصاصی خود، ابتدا
        <a href="/pages/auth.html" class="text-brand-400 hover:text-brand-300 font-bold">وارد شوید</a>.
      </p>
    </main>

    <div id="footer" class="no-print"></div>
    <div id="scroll-top" class="no-print"></div>
  </body>
</html>
