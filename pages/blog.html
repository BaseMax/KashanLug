<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>پست‌های آزاد | کاشان‌لاگ</title>
    <meta name="description" content="پست‌های آزاد - مقالاتی از اعضای جامعهٔ لینوکس کاشان." />
    <link rel="icon" type="image/png" href="/assets/images/KL1-02.png" />
    <script type="module" src="/src/main.ts"></script>
  </head>

  <body data-page="blog" class="bg-ink-950 text-gray-200 antialiased overflow-x-hidden">
    <div id="header"></div>

    <main class="pt-32 pb-24 relative overflow-hidden">
      <div class="glow w-[34rem] h-96 bg-brand-600/10 -top-10 left-0"></div>

      <div class="relative max-w-6xl mx-auto px-4 sm:px-6">
        <div class="text-center mb-12">
          <h1 class="text-4xl sm:text-5xl font-black text-white title-underline pb-2 mb-6 inline-block">پست‌های آزاد</h1>
          <p class="text-gray-400 max-w-xl mx-auto">مقالاتی از اعضای جامعهٔ لینوکس کاشان دربارهٔ نرم‌افزار آزاد، زیرساخت و توسعه.</p>
        </div>

        <div x-data="blogApp">
          <!-- controls -->
          <div class="flex flex-col md:flex-row md:items-center gap-4 mb-10">
            <div class="relative flex-1">
              <svg class="w-5 h-5 absolute right-4 top-1/2 -translate-y-1/2 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
              <input type="text" x-model="query" placeholder="جستجو در مقاله‌ها..."
                class="w-full pr-12 pl-4 py-3 rounded-2xl bg-ink-900 border border-white/10 text-white placeholder-gray-600 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30 outline-none transition" />
            </div>
            <div class="flex flex-wrap gap-2 overflow-x-auto no-scrollbar">
              <template x-for="cat in categories" :key="cat">
                <button @click="category = cat"
                  class="px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap transition-all"
                  :class="category === cat ? 'bg-brand-500 text-white' : 'bg-ink-900 text-gray-300 border border-white/10 hover:bg-white/5'"
                  x-text="cat"></button>
              </template>
            </div>
          </div>

          <!-- grid -->
          <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
            <template x-for="p in filtered" :key="p.id">
              <article class="card-glow group bg-ink-900 border border-white/10 rounded-3xl overflow-hidden hover:-translate-y-2 flex flex-col">
                <div class="relative h-40 bg-gradient-to-br from-ink-800 to-ink-850 flex items-center justify-center overflow-hidden">
                  <div class="absolute inset-0 bg-grid opacity-40"></div>
                  <span class="relative font-mono text-3xl text-brand-400/80 group-hover:scale-110 transition-transform" x-text="'~/' + p.tag"></span>
                  <span class="absolute top-3 right-3 px-2.5 py-1 rounded-full bg-ink-950/70 backdrop-blur text-[11px] text-gray-300 border border-white/10" x-text="p.category"></span>
                </div>
                <div class="p-6 flex flex-col flex-1">
                  <div class="flex items-center gap-3 text-xs text-gray-500 mb-3">
                    <span x-text="p.author"></span><span class="w-1 h-1 rounded-full bg-gray-600"></span><span x-text="p.date"></span>
                  </div>
                  <h3 class="text-white font-bold leading-snug mb-3 group-hover:text-brand-400 transition-colors line-clamp-2" x-text="p.title"></h3>
                  <p class="text-gray-400 text-sm leading-relaxed mb-5 line-clamp-3 flex-1" x-text="p.excerpt"></p>
                  <div class="flex items-center justify-between mt-auto pt-4 border-t border-white/5">
                    <span class="text-brand-400 text-sm font-bold inline-flex items-center gap-1">بیشتر بخوانید
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7"/></svg>
                    </span>
                    <span class="text-gray-500 text-xs" x-text="p.readMinutes + ' دقیقه مطالعه'"></span>
                  </div>
                </div>
              </article>
            </template>
          </div>

          <div x-show="filtered.length === 0" class="py-20 text-center text-gray-500">
            <p class="font-mono">$ grep "<span x-text="query"></span>" posts/ → no results</p>
            <p class="mt-2">مقاله‌ای با این مشخصات یافت نشد.</p>
          </div>

          <p x-show="filtered.length > 0" class="mt-12 text-center text-gray-600 text-sm font-mono">- به پایان لیست رسیدید -</p>
        </div>
      </div>
    </main>

    <div id="footer"></div>
    <div id="scroll-top"></div>
  </body>
</html>
