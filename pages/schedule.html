<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>برنامهٔ زمانی | کاشان‌لاگ</title>
    <meta name="description" content="برنامهٔ زمانی رویداد زندگی در سایه - کاشان‌لاگ." />
    <link rel="icon" type="image/png" href="/assets/images/KL1-02.png" />
    <script type="module" src="/src/main.ts"></script>
  </head>

  <body data-page="schedule" class="bg-ink-950 text-gray-200 antialiased overflow-x-hidden">
    <div id="header"></div>

    <main class="pt-28 pb-24">
      <div class="max-w-4xl mx-auto px-4 sm:px-6">
        <!-- header -->
        <div class="relative mb-12 text-center">
          <div class="glow w-80 h-80 bg-brand-600/15 -top-20 right-0"></div>
          <div class="relative">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-white/5 border border-white/10 text-xs text-gray-300 mb-5">
              <span class="font-mono text-brand-400">~/events/zendegi-dar-saye</span>
            </div>
            <h1 class="text-4xl sm:text-5xl font-black text-white mb-4">برنامهٔ زمانی</h1>
            <p class="text-gray-400">پنج‌شنبه ۲۱ خرداد ۱۴۰۵ - از ساعت ۱۷:۰۰ تا ۲۱:۰۰</p>
          </div>
        </div>

        <div x-data="scheduleApp">
          <!-- filters -->
          <div class="flex flex-wrap items-center justify-center gap-2 mb-10">
            <template x-for="f in filters" :key="f.id">
              <button @click="filter = f.id"
                class="px-4 py-2 rounded-xl text-sm font-bold transition-all"
                :class="filter === f.id ? 'bg-brand-500 text-white shadow-lg shadow-brand-900/40' : 'bg-white/5 text-gray-300 border border-white/10 hover:bg-white/10'"
                x-text="f.label"></button>
            </template>
          </div>

          <!-- timeline -->
          <div class="relative">
            <!-- vertical line -->
            <div class="absolute top-0 bottom-0 right-[7.5rem] sm:right-[8.5rem] w-px bg-white/10 hidden xs:block"></div>

            <div class="space-y-4">
              <template x-for="(s, i) in visible" :key="i">
                <div class="relative flex gap-4 sm:gap-6 group"
                  x-transition:enter="transition ease-out duration-300"
                  x-transition:enter-start="opacity-0 translate-y-2"
                  x-transition:enter-end="opacity-100 translate-y-0">
                  <!-- time -->
                  <div class="w-24 sm:w-28 shrink-0 text-left pt-4 font-mono tabular-nums">
                    <div class="text-white font-bold" x-text="s.start"></div>
                    <div class="text-gray-600 text-xs" x-text="'تا ' + s.end"></div>
                  </div>
                  <!-- dot -->
                  <div class="relative hidden xs:flex flex-col items-center pt-5">
                    <span class="w-4 h-4 rounded-full ring-4 ring-ink-950 z-10" :class="meta(s.kind).dot"></span>
                  </div>
                  <!-- card -->
                  <div class="flex-1 mb-1">
                    <div class="p-5 rounded-2xl bg-ink-900 border border-white/10 group-hover:border-brand-500/40 transition-colors">
                      <div class="flex items-start justify-between gap-3">
                        <h3 class="text-white font-bold leading-snug" x-text="s.title"></h3>
                        <span class="shrink-0 px-2.5 py-0.5 rounded-full text-[11px] font-bold text-white" :class="meta(s.kind).bar" x-text="meta(s.kind).label"></span>
                      </div>
                      <div x-show="s.speaker" class="flex items-center gap-2 mt-3 text-sm text-gray-400">
                        <svg class="w-4 h-4 text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A13 13 0 0112 16c2.5 0 4.847.655 6.879 1.804M15 10a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                        <span x-text="s.speaker"></span>
                      </div>
                    </div>
                  </div>
                </div>
              </template>
            </div>
          </div>

          <div class="mt-12 text-center">
            <a href="https://evnd.co/H45r2" target="_blank" rel="noopener"
              class="inline-flex items-center gap-2 px-7 py-3.5 rounded-2xl font-bold text-white bg-gradient-to-l from-brand-600 to-brand-500 shadow-lg shadow-brand-900/40 hover:-translate-y-0.5 transition-all">
              ثبت‌نام در رویداد
            </a>
          </div>
        </div>
      </div>
    </main>

    <div id="footer"></div>
    <div id="scroll-top"></div>
  </body>
</html>
