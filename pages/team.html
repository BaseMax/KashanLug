<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تیم اجرایی | کاشان‌لاگ</title>
    <meta name="description" content="تیم اجرایی کاشان‌لاگ - جمعی از داوطلبان و علاقه‌مندان به نرم‌افزار آزاد." />
    <link rel="icon" type="image/png" href="/assets/images/KL1-02.png" />
    <script type="module" src="/src/main.ts"></script>
  </head>

  <body data-page="team" class="bg-ink-950 text-gray-200 antialiased overflow-x-hidden" x-data="teamApp">
    <div id="header"></div>

    <main class="pt-28 pb-24 relative">
      <div class="glow w-[36rem] h-96 bg-brand-600/10 top-10 left-1/2 -translate-x-1/2"></div>

      <div class="relative max-w-6xl mx-auto px-4 sm:px-6">
        <div class="mb-14 text-center">
          <h1 class="text-4xl sm:text-5xl font-black text-white title-underline pb-2 mb-6 inline-block">تیم اجرایی کاشان‌لاگ</h1>
          <p class="text-gray-400 leading-relaxed max-w-2xl mx-auto">
            جمعی از داوطلبان و علاقه‌مندان به نرم‌افزار آزاد که با همکاری و اشتیاق، برای رشد
            جامعهٔ متن‌باز و برگزاری رویدادهای کاشان‌لاگ تلاش می‌کنند.
          </p>
        </div>

        <!-- grid -->
        <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6">
          <template x-for="(member, index) in members" :key="member.id">
            <div @click="openModal(member)"
              class="card-glow group cursor-pointer bg-ink-900 border border-white/10 rounded-3xl p-6 hover:-translate-y-2 text-center flex flex-col items-center"
              x-transition:enter="transition ease-out duration-500"
              :style="`transition-delay:${index*40}ms`">

              <template x-if="member.badge">
                <div class="absolute -top-2.5 px-3 py-1 rounded-full bg-gradient-to-l from-brand-600 to-brand-500 text-white text-[10px] font-bold shadow-md z-10" x-text="member.badge"></div>
              </template>

              <div class="relative w-24 h-24 mb-4">
                <div class="absolute inset-0 rounded-full bg-gradient-to-tr from-brand-500 to-term-500 opacity-0 group-hover:opacity-100 blur transition-opacity"></div>
                <img :src="member.avatar" :alt="member.name"
                  class="relative w-full h-full object-cover rounded-full ring-2 ring-white/10 z-10 group-hover:scale-105 transition-transform bg-ink-800" />
              </div>

              <h3 class="font-bold text-white mb-1 group-hover:text-brand-400 transition-colors" x-text="member.name"></h3>
              <p class="text-xs text-gray-500 mb-4" x-text="member.role"></p>

              <div class="mt-auto w-full py-2 bg-white/5 text-gray-300 text-xs font-bold rounded-xl group-hover:bg-brand-500/15 group-hover:text-brand-400 transition-colors flex items-center justify-center gap-1">
                مشاهدهٔ پروفایل
                <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
              </div>
            </div>
          </template>
        </div>
      </div>
    </main>

    <!-- ===================== MODAL ===================== -->
    <div x-show="modalOpen" x-cloak class="fixed inset-0 z-[100] flex items-center justify-center p-4">
      <div class="absolute inset-0 bg-ink-950/80 backdrop-blur-sm"
        x-show="modalOpen"
        x-transition:enter="transition ease-out duration-300" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"
        x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100" x-transition:leave-end="opacity-0"
        @click="closeModal()"></div>

      <div class="relative w-full max-w-md bg-ink-900 border border-white/10 rounded-4xl shadow-2xl overflow-hidden"
        x-show="modalOpen"
        x-transition:enter="transition ease-out duration-300 delay-75" x-transition:enter-start="opacity-0 translate-y-8 scale-95" x-transition:enter-end="opacity-100 translate-y-0 scale-100"
        x-transition:leave="transition ease-in duration-200" x-transition:leave-start="opacity-100 scale-100" x-transition:leave-end="opacity-0 scale-95">

        <button @click="closeModal()" class="absolute top-4 left-4 z-20 w-9 h-9 flex items-center justify-center bg-white/10 hover:bg-white/20 text-white rounded-full transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>

        <div class="h-28 bg-gradient-to-l from-brand-600 to-brand-700 relative">
          <div class="absolute inset-0 bg-grid opacity-30"></div>
        </div>

        <div class="px-8 pb-8 text-center">
          <div class="relative w-28 h-28 mx-auto -mt-14 mb-4">
            <img :src="activeMember?.avatar" :alt="activeMember?.name" class="w-full h-full object-cover rounded-full border-4 border-ink-900 bg-ink-800 shadow-lg" />
          </div>
          <h3 class="text-2xl font-black text-white mb-1" x-text="activeMember?.name"></h3>
          <p class="text-sm font-bold text-brand-400 mb-4" x-text="activeMember?.role"></p>
          <p class="text-sm text-gray-400 leading-relaxed mb-7" x-text="activeMember?.bio"></p>

          <div class="grid grid-cols-2 gap-3">
            <template x-if="activeMember?.github">
              <a :href="activeMember?.github" target="_blank" rel="noopener"
                class="flex items-center justify-center gap-2 py-3 rounded-xl bg-white/5 hover:bg-white text-gray-300 hover:text-ink-950 font-medium text-sm transition-all group">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.48 2 2 6.48 2 12c0 4.42 2.87 8.17 6.84 9.49.5.09.68-.22.68-.48 0-.24-.01-.87-.01-1.7-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.46-1.11-1.46-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.89 1.53 2.34 1.09 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.56-1.11-4.56-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02A9.56 9.56 0 0 1 12 6.84c.85 0 1.71.11 2.5.33 1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.69-4.57 4.94.36.31.68.92.68 1.85 0 1.34-.01 2.42-.01 2.74 0 .27.18.58.69.48A10 10 0 0 0 22 12c0-5.52-4.48-10-10-10z"/></svg>
                گیت‌هاب
              </a>
            </template>
            <template x-if="activeMember?.linkedin">
              <a :href="activeMember?.linkedin" target="_blank" rel="noopener"
                class="flex items-center justify-center gap-2 py-3 rounded-xl bg-white/5 hover:bg-[#0077b5] text-gray-300 hover:text-white font-medium text-sm transition-all"
                :class="!activeMember?.github ? 'col-span-2' : ''">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M20.447 20.452h-3.554v-5.569c0-1.328-.027-3.037-1.852-3.037-1.853 0-2.136 1.445-2.136 2.939v5.667H9.351V9h3.414v1.561h.046c.477-.9 1.637-1.85 3.37-1.85 3.601 0 4.267 2.37 4.267 5.455v6.286zM5.337 7.433a2.062 2.062 0 01-2.063-2.065 2.064 2.064 0 112.063 2.065zm1.782 13.019H3.555V9h3.564v11.452zM22.225 0H1.771C.792 0 0 .774 0 1.729v20.542C0 23.227.792 24 1.771 24h20.451C23.2 24 24 23.227 24 22.271V1.729C24 .774 23.2 0 22.222 0h.003z"/></svg>
                لینکدین
              </a>
            </template>
            <template x-if="!activeMember?.github && !activeMember?.linkedin">
              <div class="col-span-2 py-3 text-center text-gray-600 text-sm">راه ارتباطی عمومی ثبت نشده است.</div>
            </template>
          </div>
        </div>
      </div>
    </div>

    <div id="footer"></div>
    <div id="scroll-top"></div>
  </body>
</html>
