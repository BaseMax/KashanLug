<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تماس با ما | کاشان‌لاگ</title>
    <meta name="description" content="راه‌های ارتباط با کاشان‌لاگ - ایمیل، تلگرام و فرم تماس." />
    <link rel="icon" type="image/png" href="/assets/images/KL1-02.png" />
    <script type="module" src="/src/main.ts"></script>
  </head>

  <body data-page="contact" class="bg-ink-950 text-gray-200 antialiased overflow-x-hidden">
    <div id="header"></div>

    <main class="pt-32 pb-24 relative overflow-hidden">
      <div class="glow w-[34rem] h-96 bg-brand-600/10 -top-10 left-1/2 -translate-x-1/2"></div>

      <div class="relative max-w-5xl mx-auto px-4 sm:px-6">
        <div class="text-center mb-14">
          <h1 class="text-4xl sm:text-5xl font-black text-white title-underline pb-2 mb-6 inline-block">تماس با ما</h1>
          <p class="text-gray-400 max-w-xl mx-auto leading-relaxed">سؤالی دارید یا می‌خواهید با ما همکاری کنید؟ از هر یک از راه‌های زیر با ما در ارتباط باشید.</p>
        </div>

        <div class="grid lg:grid-cols-5 gap-8">
          <!-- info -->
          <div class="lg:col-span-2 space-y-4">
            <a href="mailto:kashanlugsupport@gmail.com" class="flex items-center gap-4 p-5 rounded-3xl bg-ink-900 border border-white/10 hover:border-brand-500/50 transition-colors group">
              <div class="w-12 h-12 rounded-2xl bg-brand-500/15 text-brand-400 flex items-center justify-center shrink-0">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
              </div>
              <div class="min-w-0">
                <div class="text-white font-bold">ایمیل</div>
                <div class="text-gray-400 text-sm font-mono break-all group-hover:text-brand-400 transition-colors">kashanlugsupport@gmail.com</div>
              </div>
            </a>
            <a href="https://t.me/KashanLUG" target="_blank" rel="noopener" class="flex items-center gap-4 p-5 rounded-3xl bg-ink-900 border border-white/10 hover:border-brand-500/50 transition-colors group">
              <div class="w-12 h-12 rounded-2xl bg-sky-500/15 text-sky-400 flex items-center justify-center shrink-0">
                <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>
              </div>
              <div>
                <div class="text-white font-bold">کانال تلگرام</div>
                <div class="text-gray-400 text-sm group-hover:text-brand-400 transition-colors">@KashanLUG</div>
              </div>
            </a>
            <a href="https://t.me/KashanLUG_gp" target="_blank" rel="noopener" class="flex items-center gap-4 p-5 rounded-3xl bg-ink-900 border border-white/10 hover:border-brand-500/50 transition-colors group">
              <div class="w-12 h-12 rounded-2xl bg-term-500/15 text-term-400 flex items-center justify-center shrink-0">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m6-1.13a4 4 0 10-4-4 4 4 0 004 4z"/></svg>
              </div>
              <div>
                <div class="text-white font-bold">گروه پشتیبانی</div>
                <div class="text-gray-400 text-sm group-hover:text-brand-400 transition-colors">@KashanLUG_gp</div>
              </div>
            </a>
            <div class="flex items-center gap-4 p-5 rounded-3xl bg-ink-900 border border-white/10">
              <div class="w-12 h-12 rounded-2xl bg-brand-500/15 text-brand-400 flex items-center justify-center shrink-0">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a2 2 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
              </div>
              <div>
                <div class="text-white font-bold">کاشان</div>
                <div class="text-gray-400 text-sm">دانشگاه آزاد واحد کاشان</div>
              </div>
            </div>
          </div>

          <!-- form -->
          <div class="lg:col-span-3">
            <form x-data="contactForm" @submit.prevent="submit()" class="p-7 sm:p-8 rounded-3xl bg-ink-900 border border-white/10">
              <template x-if="!sent">
                <div class="space-y-5">
                  <div class="grid sm:grid-cols-2 gap-5">
                    <div>
                      <label class="block text-sm text-gray-300 mb-2">نام و نام خانوادگی</label>
                      <input type="text" required placeholder="نام شما"
                        class="w-full px-4 py-3 rounded-xl bg-ink-950 border border-white/10 text-white placeholder-gray-600 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30 outline-none transition" />
                    </div>
                    <div>
                      <label class="block text-sm text-gray-300 mb-2">ایمیل</label>
                      <input type="email" required dir="ltr" placeholder="you@example.com"
                        class="w-full px-4 py-3 rounded-xl bg-ink-950 border border-white/10 text-white placeholder-gray-600 text-left focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30 outline-none transition" />
                    </div>
                  </div>
                  <div>
                    <label class="block text-sm text-gray-300 mb-2">موضوع</label>
                    <input type="text" required placeholder="موضوع پیام"
                      class="w-full px-4 py-3 rounded-xl bg-ink-950 border border-white/10 text-white placeholder-gray-600 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30 outline-none transition" />
                  </div>
                  <div>
                    <label class="block text-sm text-gray-300 mb-2">پیام شما</label>
                    <textarea required rows="5" placeholder="متن پیام..."
                      class="w-full px-4 py-3 rounded-xl bg-ink-950 border border-white/10 text-white placeholder-gray-600 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30 outline-none transition resize-none"></textarea>
                  </div>
                  <button type="submit" :disabled="sending"
                    class="w-full flex items-center justify-center gap-2 px-6 py-3.5 rounded-2xl font-bold text-white bg-gradient-to-l from-brand-600 to-brand-500 shadow-lg shadow-brand-900/40 hover:-translate-y-0.5 transition-all disabled:opacity-60 disabled:translate-y-0">
                    <span x-show="!sending">ارسال پیام</span>
                    <span x-show="sending" x-cloak class="flex items-center gap-2">
                      <svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.37 0 0 5.37 0 12h4z"></path></svg>
                      در حال ارسال...
                    </span>
                  </button>
                </div>
              </template>
              <template x-if="sent">
                <div class="py-12 text-center" x-transition>
                  <div class="w-16 h-16 mx-auto rounded-full bg-term-500/15 text-term-400 flex items-center justify-center mb-5">
                    <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
                  </div>
                  <h3 class="text-xl font-bold text-white mb-2">پیام شما ثبت شد</h3>
                  <p class="text-gray-400 text-sm">این یک نسخهٔ نمایشی است؛ در نسخهٔ نهایی پیام شما به تیم کاشان‌لاگ ارسال می‌شود.</p>
                  <button @click="sent = false" class="mt-6 text-brand-400 hover:text-brand-300 font-bold text-sm">ارسال پیام دیگر</button>
                </div>
              </template>
            </form>
          </div>
        </div>
      </div>
    </main>

    <div id="footer"></div>
    <div id="scroll-top"></div>
  </body>
</html>
